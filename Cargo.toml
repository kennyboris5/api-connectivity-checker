[package]
name = "api-connectivity-checker"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI 框架（原生窗口）；显式选用 glow/OpenGL 后端，依赖更轻、跨机兼容性更好
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
# 时间格式化
chrono = "0.4"
# HTTP 客户端（极简阻塞式，原生 TLS，无异步运行时依赖）
ureq = "2"

# Release 构建优化：去调试符号、单代码生成单元，产物更小更快
[profile.release]
opt-level = 3
strip = true
codegen-units = 1
lto = "thin"
panic = "abort"
